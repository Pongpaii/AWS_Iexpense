name: android

# build debug APK เป็น artifact (ดาวน์โหลดได้จากหน้า Actions run)
# ค่า VITE_* อ่านจาก CloudFormation outputs ผ่าน OIDC (บน main) หรือจาก repository variables
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 ต้องใช้ JDK 21
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: money-flow-android-${{ github.run_id }}

      - name: Resolve app config
        env:
          HAS_AWS: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && github.ref == 'refs/heads/main' }}
          V_API: ${{ vars.VITE_API_URL }}
          V_POOL: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          V_CLIENT: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$1" \
            --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          if [ "$HAS_AWS" = "true" ]; then
            V_API=$(out MoneyFlow-ApiStack ViteApiUrl)
            V_POOL=$(out MoneyFlow-AuthStack ViteCognitoUserPoolId)
            V_CLIENT=$(out MoneyFlow-AuthStack ViteCognitoClientId)
          fi
          {
            echo "VITE_API_URL=$V_API"
            echo "VITE_COGNITO_USER_POOL_ID=$V_POOL"
            echo "VITE_COGNITO_CLIENT_ID=$V_CLIENT"
            echo "VITE_AWS_REGION=ap-southeast-1"
          } >> "$GITHUB_ENV"
          [ -n "$V_API" ] || echo "::warning::ไม่มีค่า VITE_* — APK จะเปิดได้เฉพาะโหมดทดลอง"

      - name: Build web
        run: npm run build -w web

      - name: Capacitor sync
        working-directory: web
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: money-flow-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
